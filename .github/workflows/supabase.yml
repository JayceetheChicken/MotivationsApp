name: Supabase database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --local

      - name: Lint database
        run: supabase db lint --local --level warning

      - name: Run pgTAP tests
        run: supabase test db

      - name: Run local Supabase API E2E
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          npm run test:supabase:e2e
