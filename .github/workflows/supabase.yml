name: Supabase database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --local

      - name: Lint database
        run: supabase db lint --local --level warning

      - name: Run pgTAP tests
        run: supabase test db

      - name: Run local Supabase API E2E
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          npm run test:supabase:e2e
