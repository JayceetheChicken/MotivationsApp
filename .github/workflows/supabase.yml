name: Supabase database

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/supabase-local-e2e.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Reset, lint, pgTAP and API E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset --local

      - name: Lint database
        run: supabase db lint --local --level warning

      - name: Run pgTAP tests
        run: supabase test db

      - name: Run local Supabase API E2E
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          npm run test:supabase:e2e
