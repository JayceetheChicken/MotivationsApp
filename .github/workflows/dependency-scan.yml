name: OSV dependency scan

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  scan-pr:
    name: Reject newly introduced vulnerable dependencies
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --include-git-root
        --recursive
        ./
      fail-on-vuln: true
      upload-sarif: false
