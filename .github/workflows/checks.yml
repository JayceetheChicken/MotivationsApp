name: App quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-quality:
    name: Typecheck, tests, lint and Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Run Expo Doctor
        run: npx expo-doctor
