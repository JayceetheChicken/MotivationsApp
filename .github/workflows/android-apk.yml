name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  NODE_ENV: production
  # This shareable APK is a preview, never a production release candidate.
  EXPO_PUBLIC_BUILD_PROFILE: preview
  EAS_BUILD_PROFILE: preview
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build-apk:
    name: Build shareable APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install JavaScript dependencies
        run: |
          node scripts/check-install-scripts.mjs --check-lock
          npm ci --ignore-scripts
          node scripts/check-install-scripts.mjs --rebuild

      - name: Verify app and dependencies
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=moderate

      - name: Check optional Supabase configuration
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::EXPO_PUBLIC_SUPABASE_URL is not configured in GitHub Actions. The APK will still build, but account/social features will run in local-development mode."
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::No public Supabase key is configured in GitHub Actions. The APK will still build, but account/social features will run in local-development mode."
          fi

      - name: Generate Android project
        env:
          CI: '1'
        run: |
          npx expo prebuild --platform android --clean --no-install
          node scripts/verify-native-linking.mjs android/app/src/main/AndroidManifest.xml

      - name: Tune Gradle memory for CI
        shell: bash
        run: |
          if grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> android/gradle.properties
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify merged preview manifest
        run: node scripts/verify-native-linking.mjs android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/Lernzeit-preview.apk
          ls -lh dist/Lernzeit-preview.apk

      - name: Upload Lernzeit APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lernzeit-preview-APK
          path: dist/Lernzeit-preview.apk
          if-no-files-found: error
          retention-days: 30
