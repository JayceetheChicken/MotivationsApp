name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  # NODE_ENV is deliberately NOT set here. `npm ci` omits devDependencies under
  # NODE_ENV=production, which starves the install-script policy rebuild and
  # `npm run verify` (jest, eslint, tsc, expo-doctor) of the packages they need.
  # The bundling steps below set it themselves, where it actually applies.
  # This shareable APK is a preview, never a production release candidate.
  EXPO_PUBLIC_BUILD_PROFILE: preview
  EXPO_PUBLIC_REQUIRE_SUPABASE: '1'
  EAS_BUILD_PROFILE: preview
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  database:
    uses: ./.github/workflows/supabase.yml

  build-apk:
    needs: database
    name: Build shareable APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install JavaScript dependencies
        run: |
          node scripts/check-install-scripts.mjs --check-lock
          npm ci --ignore-scripts
          node scripts/check-install-scripts.mjs --rebuild

      - name: Require a live Supabase backend
        run: node scripts/check-online-backend.mjs

      - name: Verify app and dependencies
        env:
          # Unit tests explicitly exercise guest/development modes too. The
          # online build flag is pinned again for every actual bundling step.
          EXPO_PUBLIC_REQUIRE_SUPABASE: ''
        run: |
          npm run verify
          python scripts/test-extract-apk.py
          npm audit --omit=dev --audit-level=moderate

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.3

      - name: Verify Edge Function
        working-directory: supabase/functions
        run: |
          deno fmt --check .
          deno lint .
          deno check --frozen delete-account/index.ts

      - name: Generate Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --clean --no-install
          node scripts/verify-native-linking.mjs android/app/src/main/AndroidManifest.xml

      - name: Tune Gradle memory for CI
        shell: bash
        run: |
          if grep -q '^org.gradle.jvmargs=' android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' android/gradle.properties
          else
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> android/gradle.properties
          fi

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify merged preview manifest
        run: node scripts/verify-native-linking.mjs android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK_PATH"
          mkdir -p dist
          cp "$APK_PATH" dist/Lernzeit-preview.apk
          ls -lh dist/Lernzeit-preview.apk

      - name: Inspect the actual signed APK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Lernzeit-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Lernzeit-preview.apk
          python scripts/extract-apk.py dist/Lernzeit-preview.apk "$RUNNER_TEMP/apk-inspection"
          node scripts/check-apk-contents.mjs "$RUNNER_TEMP/apk-inspection"
          sha256sum dist/Lernzeit-preview.apk > dist/Lernzeit-preview.apk.sha256

      - name: Upload Lernzeit APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lernzeit-preview-APK
          path: |
            dist/Lernzeit-preview.apk
            dist/Lernzeit-preview.apk.sha256
          if-no-files-found: error
          retention-days: 30
