project_id = "lernzeit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
# Local-only Auth configuration. The production Site URL and the redirect
# allowlist are configured in the Supabase dashboard and must never contain a
# placeholder domain; see docs/supabase-staging-deployment.md.
# The verified operator domain callback is added there, not here, so this file
# stays free of environment specific hosts.
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = [
  "lernzeit://auth/update-password?type=recovery"
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

[functions.delete-account]
# Publishable API keys are opaque and cannot use the legacy gateway JWT check.
# The function independently validates the caller's user access token with
# Auth before any service-role operation is attempted.
verify_jwt = false
